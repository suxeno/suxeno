name: Refresh profile activity

on:
  schedule:
    - cron: '23 0 * * *' # 07:23 in Jakarta (WIB)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Test and generate the profile SVGs
        env:
          PROFILE_LOGIN: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
        run: |
          python3 -B -m unittest discover -s tests -v
          python3 -B scripts/activity.py "$PROFILE_LOGIN"
          python3 -B scripts/languages.py "$PROFILE_LOGIN"

      - name: Commit changed profile assets only
        run: |
          git add -- assets/activity.svg assets/languages.svg
          if git diff --cached --quiet -- assets/activity.svg assets/languages.svg; then
            echo 'Profile assets unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --only -m 'chore: refresh profile assets' -- assets/activity.svg assets/languages.svg
          git push origin "HEAD:$GITHUB_REF"
